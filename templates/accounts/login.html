{% extends 'base.html' %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white p-8 rounded-xl border border-slate-200 shadow-sm space-y-6">
        <div>
            <h2 class="text-center text-2xl font-bold text-slate-900">Sign in to TechLand</h2>
            <p class="mt-1 text-center text-xs text-slate-500">Access your cart, order logs, and PLC quotes</p>
        </div>
        <form class="space-y-4" method="POST">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Username</label>
                <input type="text" name="username" required
                    class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm shadow-sm transition">
                Sign In
            </button>
        </form>
        <p class="text-center text-xs text-slate-500">
            Don't have an account? <a href="{% url 'register' %}"
                class="text-blue-600 font-semibold hover:underline">Register</a>
        </p>
    </div>
</div>
{% endblock %}
