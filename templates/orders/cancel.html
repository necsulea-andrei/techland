{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-16 text-center">
    <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-6">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
    </div>
    <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Checkout Cancelled</h1>
    <p class="text-slate-600 mb-6">Your transaction was not processed and no items were deducted from inventory.</p>
    <a href="{% url 'view_cart' %}"
        class="bg-slate-800 hover:bg-slate-900 text-white font-semibold px-6 py-3 rounded-xl transition">
        Return to Cart
    </a>
</div>
{% endblock %}
